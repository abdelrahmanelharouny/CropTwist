name: Egypt reference data discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "mini-services/fieldshift-api/scripts/discover_egypt_reference_data.py"
      - "mini-services/fieldshift-api/tests/unit/test_egypt_reference_discovery.py"
      - "docs/data/EGYPT_REFERENCE_DISCOVERY_RUNBOOK.md"
      - "docs/data/EGYPTIAN_DATA_SOURCE_LICENSE_AUDIT_2026-11-23.md"
      - ".github/workflows/egypt-reference-discovery.yml"
  workflow_dispatch:
    inputs:
      download_archives:
        description: Download and scan Africa archives (each <= 50 MB)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependency
        run: python -m pip install --disable-pip-version-check httpx==0.28.1
      - name: Discover Egypt-relevant RDM collections and Africa archive metadata
        working-directory: mini-services/fieldshift-api
        env:
          DOWNLOAD_ARCHIVES: ${{ github.event_name == 'workflow_dispatch' && inputs.download_archives || 'true' }}
        run: |
          if [ "$DOWNLOAD_ARCHIVES" = "true" ]; then
            python scripts/discover_egypt_reference_data.py --download-africa-archives --output egypt-reference-discovery.json
          else
            python scripts/discover_egypt_reference_data.py --output egypt-reference-discovery.json
          fi
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-reference-discovery-report
          path: |
            mini-services/fieldshift-api/egypt-reference-discovery.json
            mini-services/fieldshift-api/.cache/egypt-reference-discovery/
          if-no-files-found: warn
          retention-days: 30
