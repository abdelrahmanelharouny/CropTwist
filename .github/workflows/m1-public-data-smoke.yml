name: M1 Public Data Smoke

on:
  pull_request:
    paths:
      - "mini-services/fieldshift-api/scripts/m1_public_data_smoke.py"
      - ".github/workflows/m1-public-data-smoke.yml"
      - "docs/testing/M1_SAFE_LIVE_VALIDATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-public-data-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  public-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: mini-services/fieldshift-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-services/fieldshift-api/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run bounded live public-provider checks
        run: python scripts/m1_public_data_smoke.py | tee /tmp/m1-public-data-evidence.json
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-public-data-smoke-evidence
          path: /tmp/m1-public-data-evidence.json
          if-no-files-found: warn
